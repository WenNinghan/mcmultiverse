<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153e33">
  <title>这一口，我判了。｜麦门宇宙</title>
  <meta name="description" content="先盲选，再揭价，只换一份。用真实麦当劳 MCP 报价，给自己的偏爱盖个章。">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/triad.css">
</head>
<body>
  <header class="site-header">
    <button class="brand" data-action="home" aria-label="麦门宇宙首页"><span class="brand-mark" aria-hidden="true">m<span>·</span></span><span>麦门宇宙<small>McMULTIVERSE</small></span></button>
    <div class="header-right"><span class="preview-tag">本机试玩 · VOL.03</span><button id="storeButton" class="store-button" data-action="open-store"><i aria-hidden="true"></i><span>正在连接 MCP</span><b aria-hidden="true">⌄</b></button></div>
  </header>
  <div class="workbench">
    <aside class="wb-rail" id="rail" aria-label="玩法切换栏"></aside>
    <main id="app" aria-live="polite"></main>
  </div>
  <footer class="site-footer"><span>随心选，认真算。<br><small>非官方创意作品 · 餐品图版权归各权利人</small></span><button data-action="evidence">查看这次 MCP 调用</button></footer>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="storeDialog" class="store-dialog">
    <form id="storeForm"><div class="dialog-head"><div><span class="eyebrow">REAL MENU / 真实门店</span><h2>先借一间餐厅。</h2></div><button type="button" class="icon-button" data-action="close-store" aria-label="关闭">×</button></div>
      <p>价格与可售餐品以所选门店、查询时刻为准。选择门店会另开一局；当前仅查询，不会下单。</p>
      <div class="store-fields"><label>城市<input name="city" value="上海" required maxlength="30" autocomplete="address-level2"></label><label>位置或门店关键词<input name="keyword" value="人民广场" required maxlength="70" autocomplete="off"></label></div>
      <button class="primary-button" type="submit">查找餐厅 <span aria-hidden="true">↗</span></button>
    </form>
    <p id="storeStatus" role="status"></p><div id="storeResults" class="store-results"></div>
  </dialog>
  <dialog id="evidenceDialog" class="evidence-dialog"><div class="dialog-head"><div><span class="eyebrow">SOURCE / 有据可查</span><h2>这次是怎么算的。</h2></div><button class="icon-button" data-action="close-evidence" aria-label="关闭">×</button></div><div id="evidenceContent"></div></dialog>
  <dialog id="shareDialog" class="share-dialog"><div class="dialog-head"><div><span class="eyebrow">PASS IT ON / 把偏爱递出去</span><h2>你会选哪一盘？</h2></div><button class="icon-button" data-action="close-share" aria-label="关闭分享文字">×</button></div><p>分享文字已准备好。如浏览器没有自动复制，可选中下方文字复制。</p><textarea id="shareText" readonly aria-label="可复制的分享文字"></textarea><button class="secondary-button" data-action="select-share">全选文字</button></dialog>
  <script type="module" src="assets/triad-v3-ui.js"></script>
</body>
</html>
